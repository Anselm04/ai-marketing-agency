name: Fix orchestrator scope

on:
  push:
    paths:
      - '.github/workflows/fix-orchestrator-scope.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix content length scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('backend/src/services/intelligentOrchestrator.js')
          text = path.read_text()

          pattern = r"(\s*// Score each model for this specific task\s*)const scoredModels = availableModels\.map\(\(model\) => \{"
          replacement = r"\1const contentLength = content.length;\n    const estimatedTokens = Math.ceil(contentLength / 4);\n    const scoredModels = availableModels.map((model) => {"
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one model-scoring block, found {count}')

          inner = r"(\s*// Context window fit \(for long content\)\s*)const contentLength = content\.length;\s*const estimatedTokens = Math\.ceil\(contentLength / 4\);"
          text, count = re.subn(inner, r"\1", text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one inner content-length block, found {count}')

          old = 'estimatedTokens: Math.ceil(content.length / 4),'
          if old not in text:
              raise SystemExit('Expected return estimatedTokens expression not found')
          text = text.replace(old, 'estimatedTokens,', 1)
          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/intelligentOrchestrator.js
          git diff --cached --quiet || git commit -m "fix(orchestrator): keep content length in model-selection scope"
          git push
