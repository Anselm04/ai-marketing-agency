name: Fix orchestrator scope

on:
  push:
    paths:
      - '.github/workflows/fix-orchestrator-scope.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix content length scope
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/src/services/intelligentOrchestrator.js')
          text = path.read_text()
          old = """    // Score each model for this specific task\n    const scoredModels = availableModels.map((model) => {\n"""
          new = """    // Score each model for this specific task\n    const contentLength = content.length;\n    const estimatedTokens = Math.ceil(contentLength / 4);\n    const scoredModels = availableModels.map((model) => {\n"""
          if old not in text:
              raise SystemExit('Expected model-scoring block not found')
          text = text.replace(old, new, 1)
          old_inner = """      // Context window fit (for long content)\n      const contentLength = content.length;\n      const estimatedTokens = Math.ceil(contentLength / 4);\n"""
          if old_inner not in text:
              raise SystemExit('Expected inner content-length block not found')
          text = text.replace(old_inner, "      // Context window fit (for long content)\n", 1)
          text = text.replace("estimatedTokens: Math.ceil(content.length / 4),", "estimatedTokens,", 1)
          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/intelligentOrchestrator.js
          git diff --cached --quiet || git commit -m "fix(orchestrator): keep content length in model-selection scope"
          git push
