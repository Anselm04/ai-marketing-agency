name: Temporary React 19 lockfile compatibility
on:
  push:
    branches: [dependabot/npm_and_yarn/production-dependencies-f6ab6e0052]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate and inspect dependency resolution
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          node -e 'const p=require("./package-lock.json").packages;for(const k of ["node_modules/react","frontend/node_modules/react","node_modules/react-dom","frontend/node_modules/react-dom","node_modules/qs","node_modules/follow-redirects"])console.log("RESOLUTION "+k+" "+p[k]?.version)'
          echo 'BEGIN_LOCK85'
          node -e 'const c=require("fs").readFileSync("package-lock.json","utf8");for(let i=0;i<c.length;i+=6000)console.log("LOCK85:"+JSON.stringify(c.slice(i,i+6000)))'
          echo 'END_LOCK85'
