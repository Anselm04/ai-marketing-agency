name: Temporary PR85 production lockfile resolution
on:
  push:
    branches: [dependabot/npm_and_yarn/production-dependencies-f6ab6e0052]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve production upgrades with current main
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          echo 'BEGIN_LOCK85'
          node -e 'const c=require("fs").readFileSync("package-lock.json","utf8");for(let i=0;i<c.length;i+=6000)console.log("LOCK85:"+JSON.stringify(c.slice(i,i+6000)))'
          echo 'END_LOCK85'
