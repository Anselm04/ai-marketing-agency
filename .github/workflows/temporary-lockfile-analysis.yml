name: Temporary lockfile repair analysis
on:
  push:
    branches: [feature/customer-authorized-ad-spend-controls]
permissions:
  contents: read
jobs:
  package-lock-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve compatible security patches
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'dependencies.qs=6.17.1' 'overrides.qs=6.17.1'
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          npm audit --omit=dev --audit-level=moderate || true
          echo 'BEGIN_PACKAGE_REPAIRS_JSON'
          node -e 'const fs=require("fs");for(const name of ["package.json","package-lock.json"]){const c=fs.readFileSync(name,"utf8");console.log("FILE_BEGIN:"+name);for(let i=0;i<c.length;i+=8000)console.log("FILE_CHUNK:"+JSON.stringify(c.slice(i,i+6000)));console.log("FILE_END:"+name)}'
          echo 'END_PACKAGE_REPAIRS_JSON'
