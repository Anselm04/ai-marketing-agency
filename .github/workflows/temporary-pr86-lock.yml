name: Temporary PR86 locked dependency update
on:
  push:
    branches: [dependabot/npm_and_yarn/development-dependencies-e2fad9a464]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate coherent lockfile using npm
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          echo 'BEGIN_LOCK86'
          node -e 'const c=require("fs").readFileSync("package-lock.json","utf8");for(let i=0;i<c.length;i+=6000)console.log("LOCK86:"+JSON.stringify(c.slice(i,i+6000)))'
          echo 'END_LOCK86'
