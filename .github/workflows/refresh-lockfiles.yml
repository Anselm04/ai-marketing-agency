name: Refresh dependency lockfiles

on:
  push:
    branches: [main]
    paths:
      - 'backend/package.json'
      - 'frontend/package.json'
      - '.github/workflows/refresh-lockfiles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Generate frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfiles when changed
        run: |
          if git diff --quiet -- backend/package-lock.json frontend/package-lock.json && git ls-files --error-unmatch backend/package-lock.json frontend/package-lock.json >/dev/null 2>&1; then
            echo 'Lockfiles already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package-lock.json frontend/package-lock.json
          git commit -m 'chore(deps): refresh marketing lockfiles' || exit 0
          git push
