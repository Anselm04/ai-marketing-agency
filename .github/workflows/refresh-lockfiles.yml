name: Refresh dependency lockfile

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'backend/package.json'
      - 'frontend/package.json'
      - '.github/workflows/refresh-lockfiles.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketing-lockfile-main
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Generate workspace lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git commit -m 'chore(deps): refresh marketing lockfile'
          git pull --rebase origin main
          git push
