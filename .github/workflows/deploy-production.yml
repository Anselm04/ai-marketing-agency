name: Deploy Production

on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: marketing-production
  cancel-in-progress: false

jobs:
  deploy:
    # Owner-approved Fly billing hold: do not deploy or restart paid Machines.
    if: ${{ false }}
    # Historical activation gate retained for recovery documentation only.
    # if: >-
    # (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
    # (github.event_name == 'workflow_run' &&
    # github.event.workflow_run.conclusion == 'success' &&
    # github.event.workflow_run.event == 'push' &&
    # github.event.workflow_run.head_branch == 'main' &&
    # github.event.workflow_run.head_repository &&
    # github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Check out exact validated revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify current main revision and successful push validation
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          if [ "$(git rev-parse HEAD)" != "$DEPLOY_SHA" ] || [ "$(git rev-parse FETCH_HEAD)" != "$DEPLOY_SHA" ]; then
            echo 'Refusing to deploy a revision that is not current upstream main.'
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$API_URL/repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$DEPLOY_SHA&event=push&status=success&per_page=100" \
            | jq -e --arg sha "$DEPLOY_SHA" --arg repo "$REPOSITORY" \
              'any(.workflow_runs[]; .head_sha == $sha and .head_branch == "main" and .event == "push" and .head_repository.full_name == $repo)' >/dev/null

      - name: Set up Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Require production token and critical secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not configured; refusing a false production deploy."
            exit 1
          fi

          APP="trillionai-marketing"
          SECRET_JSON="$(flyctl secrets list --app "$APP" --json)"
          SECRET_NAMES="$(printf '%s' "$SECRET_JSON" | jq -r '.[] | (.Name // .name // empty)')"

          required=(
            DATABASE_URL
            JWT_SECRET
            TRILLION_ECOSYSTEM_SHARED_SECRET
            STRIPE_SECRET_KEY
          )
          missing=0
          for name in "${required[@]}"; do
            if ! grep -Fxq "$name" <<<"$SECRET_NAMES"; then
              echo "Missing Fly runtime secret required for production: $name"
              missing=1
            fi
          done

          ai_ready=0
          for name in OPENAI_API_KEY ANTHROPIC_API_KEY GOOGLE_AI_API_KEY GROQ_API_KEY MISTRAL_API_KEY COHERE_API_KEY AZURE_OPENAI_API_KEY; do
            if grep -Fxq "$name" <<<"$SECRET_NAMES"; then
              ai_ready=1
              break
            fi
          done
          if [ "$ai_ready" -ne 1 ]; then
            echo "No production AI provider secret is configured."
            missing=1
          fi

          email_ready=0
          for name in RESEND_API_KEY SENDGRID_API_KEY SMTP_HOST; do
            if grep -Fxq "$name" <<<"$SECRET_NAMES"; then
              email_ready=1
              break
            fi
          done
          if grep -Fxq "AWS_SES_ACCESS_KEY" <<<"$SECRET_NAMES" && grep -Fxq "AWS_SES_SECRET_KEY" <<<"$SECRET_NAMES"; then
            email_ready=1
          fi
          if [ "$email_ready" -ne 1 ]; then
            echo "No production email transport is configured."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Marketing production deploy blocked until database, auth, ecosystem bridge, Stripe API, AI, and email runtime are configured."
            exit 1
          fi

      - name: Deploy TrillionAI Marketing to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config fly.toml --app trillionai-marketing

      - name: Verify production health, billing and auth boundary
        run: |
          set -euo pipefail
          URL="https://trillionai-marketing.fly.dev"
          healthy=false
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "$URL/api/health" >/tmp/health.json; then
              if jq -e '
                .status == "ok"
                and .database == "postgres"
                and .billing.stripeApiConfigured == true
                and .billing.stripeWebhookVerificationConfigured == true
              ' /tmp/health.json >/dev/null; then
                healthy=true
                break
              fi
            fi
            echo "Waiting for Marketing production health and billing readiness (attempt $i/30)..."
            sleep 10
          done

          if [ "$healthy" != "true" ]; then
            echo "Marketing production health/database/billing verification failed"
            cat /tmp/health.json 2>/dev/null || true
            exit 1
          fi

          public_status=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$URL/")
          if [ "$public_status" != "200" ]; then
            echo "Expected public Marketing app to return 200, got $public_status"
            exit 1
          fi

          protected_status=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$URL/api/agents")
          if [ "$protected_status" != "401" ]; then
            echo "Expected /api/agents to reject anonymous access with 401, got $protected_status"
            exit 1
          fi

          echo "Marketing production health, PostgreSQL persistence, Stripe verification, public UI, and auth boundary passed."

