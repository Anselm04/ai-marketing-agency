name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: marketing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked workspace
        run: npm ci --no-audit --no-fund
      - name: Backend lint
        run: npm run lint --workspace=backend
      - name: Backend tests
        run: timeout 8m npm test --workspace=backend -- --runInBand --detectOpenHandles --passWithNoTests
      - name: Frontend tests
        run: npm test --workspace=frontend
      - name: Frontend build
        run: npm run build --workspace=frontend
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v5
        with:
          context: .
          target: backend
          push: false
          tags: ai-marketing-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend/nginx
        uses: docker/build-push-action@v5
        with:
          context: .
          target: nginx
          push: false
          tags: ai-marketing-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
