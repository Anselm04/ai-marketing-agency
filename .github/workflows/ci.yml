# Production release gate: every main-branch change must pass this exact-head pipeline.
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: marketing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: marketing_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marketing_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Block cross-project lane contamination
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE --exclude-dir=node_modules --exclude-dir=.git --exclude='package-lock.json' \
            '(ride[-_ ]?global|rideglobal|\bBMX\b|ghost recording|track editor|anti-cheat)' \
            backend frontend; then
            echo 'Cross-project Ride Global/game contamination detected in Marketing Agency source.' >&2
            exit 1
          fi
          if grep -RniE --exclude-dir=node_modules --exclude-dir=.git \
            '(MONGODB_URI|MONGODB_DB_NAME|USE_MONGO|MongoClient|ObjectId)' backend/src; then
            echo 'Obsolete MongoDB persistence detected in Marketing Agency runtime source.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked workspace
        run: npm ci --no-audit --no-fund
      - name: Backend lint
        run: npm run lint --workspace=backend
      - name: Backend tests
        env:
          MARKETING_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:migration-test-only@127.0.0.1:5432/marketing_migration_test
        run: timeout 8m npm test --workspace=backend -- --runInBand --detectOpenHandles --passWithNoTests
      - name: Frontend tests
        run: npm test --workspace=frontend
      - name: Frontend build
        run: npm run build --workspace=frontend
      - name: Dependency audit (production and development)
        run: npm audit --audit-level=moderate
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v7
        with:
          context: .
          target: backend
          push: false
          tags: ai-marketing-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend/nginx
        uses: docker/build-push-action@v7
        with:
          context: .
          target: nginx
          push: false
          tags: ai-marketing-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

