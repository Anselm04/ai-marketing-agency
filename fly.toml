# TrillionAI Marketing on Fly.io (Sydney).
# Secrets stay out of git. JWT_SECRET is required for login/register.
# Stripe payment links work without STRIPE_SECRET_KEY.

app = "trillionai-marketing"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"
  build-target = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 75

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  APP_URL = "https://trillionai-marketing.fly.dev"
  CORS_ORIGIN = "https://trillionai-marketing.fly.dev,https://trillionaitech.com"
  USE_MONGO = "false"
  FRONTEND_DIST = "/app/frontend/dist"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
