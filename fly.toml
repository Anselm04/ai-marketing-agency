# TrillionAI Marketing on Fly.io (Sydney).
# Secrets stay out of git. Production requires JWT_SECRET, DATABASE_URL,
# REDIS_URL, Stripe API/webhook secrets, configured email transport,
# S3-compatible object-storage credentials, AI provider credentials/rates,
# and owner-approved AI + Course Factory storage cost limits.
# The mkt_data volume remains for local working files; durable customer media
# is stored through the S3-compatible storage service.

app = "trillionai-marketing"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"
  build-target = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 75

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/ready"
    protocol = "http"
    timeout = "5s"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  APP_URL = "https://trillionai-marketing.fly.dev"
  CORS_ORIGIN = "https://trillionai-marketing.fly.dev,https://trillionaitech.com"
  USE_MONGO = "false"
  USE_REDIS_QUEUE = "true"
  QUEUE_MEMORY_FALLBACK = "false"
  FRONTEND_DIST = "/app/frontend/dist"
  UPLOAD_DIR = "/data/uploads"
  DATA_DIR = "/data"

[mounts]
  source = "mkt_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
