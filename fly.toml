# TrillionAI Marketing on Fly.io (Sydney).
# Secrets stay out of git. JWT_SECRET is required for login/register.
#
# Durable persistence: [[mounts]] mkt_data → /data with DATA_DIR=/data.
# Create once if missing: fly volumes create mkt_data --region syd --size 1 -a trillionai-marketing
# Or set DATABASE_URL once a Postgres adapter is enabled.
#
# Secrets (fly secrets set … -a trillionai-marketing): JWT_SECRET (required),
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, RESEND_API_KEY|SMTP_*, OPENAI_API_KEY|GROQ_API_KEY,
# OAuth client ids/secrets. See .env.example — never commit real values.

app = "trillionai-marketing"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"
  build-target = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 75

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  APP_URL = "https://trillionai-marketing.fly.dev"
  CORS_ORIGIN = "https://trillionai-marketing.fly.dev,https://trillionaitech.com"
  USE_MONGO = "false"
  USE_REDIS_QUEUE = "false"
  FRONTEND_DIST = "/app/frontend/dist"
  DATA_DIR = "/data"   # requires [[mounts]] volume mkt_data (see header)

[[mounts]]
  source = "mkt_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
