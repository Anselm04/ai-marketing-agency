# TrillionAI Marketing on Fly.io (Sydney).
# Secrets stay out of git. JWT_SECRET is required for login/register.
#
# Durable persistence (owner action before claiming production-grade data):
#   fly volumes create mkt_data --region syd --size 1 -a trillionai-marketing
#   Then uncomment [[mounts]] below and set DATA_DIR=/data in [env] or as a secret.
# Or set DATABASE_URL once a Postgres adapter is enabled.
#
# AI: set OPENAI_API_KEY (or compatible) as a Fly secret for real generation.

app = "trillionai-marketing"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"
  build-target = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 75

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  APP_URL = "https://trillionai-marketing.fly.dev"
  CORS_ORIGIN = "https://trillionai-marketing.fly.dev,https://trillionaitech.com"
  USE_MONGO = "false"
  USE_REDIS_QUEUE = "false"
  FRONTEND_DIST = "/app/frontend/dist"
  DATA_DIR = "/data"   # uncomment with [[mounts]] after volume exists

[[mounts]]
  source = "mkt_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
