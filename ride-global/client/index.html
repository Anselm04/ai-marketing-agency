<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RideGlobal - BMX Web Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-overlay"></div>

    <div id="mobile-controls" class="hidden">
      <div class="mobile-zone mobile-left">
        <div class="mobile-dpad">
          <div class="mobile-btn mobile-up" id="mobile-up">▲</div>
          <div class="mobile-row">
            <div class="mobile-btn mobile-left" id="mobile-left">◀</div>
            <div class="mobile-btn mobile-right" id="mobile-right">▶</div>
          </div>
          <div class="mobile-btn mobile-down" id="mobile-down">▼</div>
        </div>
      </div>
      <div class="mobile-zone mobile-right">
        <div class="mobile-btn mobile-jump" id="mobile-jump">JUMP</div>
        <div class="mobile-tricks">
          <div class="mobile-btn mobile-trick" id="mobile-trick-1">1</div>
          <div class="mobile-btn mobile-trick" id="mobile-trick-2">2</div>
          <div class="mobile-btn mobile-trick" id="mobile-trick-3">3</div>
        </div>
      </div>
    </div>
  </div>
  <script src="src/audio.js"></script>
  <script src="src/network.js"></script>
  <script src="src/physics.js"></script>
  <script src="src/tricks.js"></script>
  <script src="src/track-editor.js"></script>
  <script src="src/renderer.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
