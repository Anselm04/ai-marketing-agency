version: '3.8'

services:
  backend:
    build:
      context: .
      target: backend
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      - backend-logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional: MongoDB for persistent data
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  backend-logs:
  mongo-data:
