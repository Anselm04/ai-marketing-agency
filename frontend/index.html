<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/appforge-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrillionAI Tech — AppForge and Marketing</title>
    <meta name="theme-color" content="#07080b" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="TrillionAI Tech: AppForge generates real live apps, games, agents, tools, software, and websites. TrillionAI Marketing runs autonomous social, ads, and SEO." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.error('SW registration failed:', err));
        });
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
